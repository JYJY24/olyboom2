name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: olyboom-android
        run: |
          npm install --no-audit --no-fund

      - name: Ensure Android project exists
        working-directory: olyboom-android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        uses: kevingopalan/action_android_build@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          APP_NAME: OlyBoom
          TYPEPACKAGE: debug
          PROJECT_DIR: olyboom-android

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OlyBoom-APK
          path: |
            olyboom-android/android/app/build/outputs/**/*.apk
            olyboom-android/android/app/build/outputs/**/*.aab
